name: Build SIYOMA Tenant & Rent Tracker V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
            echo "Android project is already at repository root."
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -name 'gradle-*.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No SIYOMA project ZIP found."
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP_FILE" -d build-project

          if [ -f "build-project/settings.gradle" ] && [ -f "build-project/app/build.gradle" ]; then
            echo "BUILD_DIR=build-project" >> "$GITHUB_ENV"
            exit 0
          fi

          PROJECT_DIR=$(find build-project -mindepth 1 -maxdepth 3 \
            -type f -name 'settings.gradle' -print -quit | xargs -r dirname)

          if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            echo "ERROR: The selected ZIP does not contain a valid Android project."
            find build-project -maxdepth 5 -type f \
              \( -name 'settings.gradle' -o -name 'build.gradle' \) -print
            exit 1
          fi

      - name: Verify official V2 icon
        shell: bash
        run: |
          set -e

          ICON="$BUILD_DIR/app/src/main/res/drawable/siyoma_v2_icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Official SIYOMA V2 icon is missing: $ICON"
            exit 1
          fi

          echo "Official SIYOMA V2 icon verified."

      - name: Build APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V2-Prepaid-Fix-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
