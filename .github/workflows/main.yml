name: Build SIYOMA Tenant Rent Tracker V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Extract V2 project ZIP
        run: |
          unzip -o SIYOMA_Tenant_Rent_Tracker_V2_UPGRADED.zip -d v2_project

      - name: Check extracted project
        run: |
          echo "Extracted project files:"
          ls -la v2_project
          echo "App directory:"
          ls -la v2_project/app

      - name: Build V2 APK
        working-directory: v2_project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          find v2_project/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V2-APK
          path: v2_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
