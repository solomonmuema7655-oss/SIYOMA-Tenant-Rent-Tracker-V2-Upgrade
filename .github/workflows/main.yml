name: Build SIYOMA Tenant & Rent Tracker V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare V2 project
        shell: bash
        run: |
          set -e
          rm -rf build-project

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
            echo "Android project found directly in repository root."
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' \
            ! -name 'gradle-8.7-bin.zip' \
            ! -name '*gradle*' \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No SIYOMA project ZIP was found."
            echo "ZIP files currently in the repository:"
            find . -maxdepth 2 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"
          mkdir -p build-project
          unzip -q "$ZIP_FILE" -d build-project

          if [ -f "build-project/settings.gradle" ] && [ -f "build-project/app/build.gradle" ]; then
            echo "BUILD_DIR=build-project" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find build-project -mindepth 1 -maxdepth 2 -type f -name 'settings.gradle' -print -quit | xargs -r dirname)

            if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/app/build.gradle" ]; then
              echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            else
              echo "ERROR: Extracted ZIP does not contain a valid Android project."
              find build-project -maxdepth 4 -type f \( -name 'settings.gradle' -o -name 'build.gradle' \) -print
              exit 1
            fi
          fi

      - name: Verify exact official V2 launcher icon
        shell: bash
        run: |
          set -e

          ICON="$BUILD_DIR/app/src/main/res/drawable/siyoma_v2_icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: The official SIYOMA V2 launcher icon is missing."
            exit 1
          fi

          echo "Official SIYOMA V2 launcher icon found: $ICON"

      - name: Make Gradle executable
        working-directory: ${{ env.BUILD_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.BUILD_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V2-Prepaid-Fix-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
