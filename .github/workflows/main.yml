name: Build SIYOMA Tenant Rent Tracker V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Find official-icon V2 ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name 'SIYOMA_Tenant_Rent_Tracker_V2_V2.0_OFFICIAL_ICON_239358.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Official-icon V2 ZIP was not found."
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V2 project
        run: |
          mkdir -p v2_project
          unzip -o "$ZIP_FILE" -d v2_project

      - name: Verify Android project
        run: |
          echo "Checking V2 project..."

          test -f v2_project/settings.gradle
          test -f v2_project/build.gradle
          test -f v2_project/app/build.gradle
          test -f v2_project/app/src/main/AndroidManifest.xml
          test -f v2_project/app/src/main/assets/index.html
          test -f v2_project/app/src/main/assets/app.js

          echo "Android project structure: OK"

          echo "Checking launcher icons..."
          find v2_project/app/src/main/res -type f \
            \( -name 'ic_launcher*' -o -name 'ic_launcher_round*' \) \
            -print

          echo "Icon resources check complete."

      - name: Build V2.0 APK
        working-directory: v2_project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Searching for generated APK..."

          APK=$(find v2_project/app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "SUCCESS: APK generated:"
          echo "$APK"

      - name: Upload V2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V2-OFFICIAL-ICON-APK
          path: v2_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
