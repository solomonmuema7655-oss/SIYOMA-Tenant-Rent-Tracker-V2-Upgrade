name: Build SIYOMA Tenant Rent Tracker V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Find V2 project ZIP
        run: |
          echo "ZIP files in repository:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -name "gradle-8.7-bin.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No V2 project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V2 project ZIP
        run: |
          mkdir -p v2_project
          unzip -o "$ZIP_FILE" -d v2_project

      - name: Verify V2 project structure
        run: |
          echo "Searching for Android project..."

          SETTINGS=$(find v2_project -name settings.gradle -type f -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find v2_project -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build
