name: Build SIYOMA Tenant Rent Tracker V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Find and extract V2 ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'SIYOMA_Tenant_Rent_Tracker_V2_UPGRADED_PASSWORD_239358.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V2 ZIP not found."
            echo "ZIP files currently in repository:"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p v2_project
          unzip -o "$ZIP_FILE" -d v2_project

      - name: Check V2 project
        run: |
          echo "Checking V2 project..."
          test -f v2_project/settings.gradle
          test -f v2_project/build.gradle
          test -f v2_project/app/build.gradle
          test -f v2_project/app/src/main/AndroidManifest.xml
          echo "V2 project structure OK."

      - name: Build V2 APK
        working-directory: v2_project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Checking APK..."
          find v2_project/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V2-APK
          path: v2_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
